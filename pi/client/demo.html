<!doctype html>
<meta charset="utf-8">
<title>Tracker live</title>
<!-- Live view of the Pi tracker: camera image with detections, top-down map, headline numbers, and everything
     the tracker prints. Open over http (not https) while on the Sesame-Controller WiFi:
       cd pi/client && python3 -m http.server 5500   then   http://localhost:5500/demo.html
     Options: ?host=qnxpi78.local&unit=3&w=640&fps=4 preset the view size and rate, which can also be changed on
     the page. The robot's access point is slow and also carries the robot's commands, so keep these modest.
     The Record button (shortcut: r) saves frames on the Pi. -->
<style>
  body { font-family: sans-serif; margin: 12px; background: #111; color: #ddd; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .view { position: relative; width: 800px; max-width: 100%; background: #222; min-height: 120px; }
  .view img, .view canvas { width: 100%; display: block; }
  .view canvas { position: absolute; left: 0; top: 0; }
  #map { background: #222; width: 360px; height: 360px; }
  #numbers { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 16px; margin: 8px 0; font-size: 14px; }
  #numbers b { font-size: 20px; display: block; }
  .ok { color: #4f4; } .bad { color: #f66; }
  #bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; font-size: 14px; }
  #bar select, #bar button { background: #222; color: #ddd; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; font-size: 14px; }
  #record { min-width: 150px; cursor: pointer; }
  #record.on { background: #a11; border-color: #f44; color: #fff; }
  #log { background: #000; color: #9c9; font: 12px/1.35 monospace; height: 260px; overflow-y: auto; padding: 6px; margin-top: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
<div id="bar">
  <button id="record" title="shortcut: r">● Record</button>
  <label>save every <select id="every"><option>1</option><option selected>2</option><option>3</option><option>5</option><option>10</option></select> frame</label>
  <label>saved size <select id="recordWidth"><option value="0">full 2304</option><option value="1152">half 1152</option></select></label>
  <span id="recordStatus"></span>
  <span style="flex:1"></span>
  <label>view size <select id="viewWidth"><option>480</option><option selected>640</option><option>960</option></select></label>
  <label>view rate <select id="viewRate"><option>2</option><option selected>4</option><option>8</option><option>12</option></select> per second</label>
</div>
<div class="row">
  <div class="view"><img id="frame" alt=""><canvas id="overlay"></canvas></div>
  <div>
    <canvas id="map" width="360" height="360"></canvas>
    <div id="numbers"></div>
  </div>
</div>
<div id="log"></div>
<script type="module">
import { floorToPixel } from "./floor.js";
const query = new URLSearchParams(location.search);
const base = `http://${query.get("host") ?? "qnxpi78.local"}:${8000 + Number(query.get("unit") ?? 3)}`;
const viewWidth = document.getElementById("viewWidth"), viewRate = document.getElementById("viewRate");
if (query.get("w")) viewWidth.value = query.get("w");
if (query.get("fps")) viewRate.value = query.get("fps");
const frame = document.getElementById("frame"), overlay = document.getElementById("overlay"), map = document.getElementById("map");
const log = document.getElementById("log"), numbers = document.getElementById("numbers");

// Objects come from the detector on the laptop (vision/scan.py --watch), which writes objects.json next to this
// page after every scan. Positions are floor centimetres, so they are drawn on the map directly and projected into
// the camera image with the camera pose of the current frame: the outlines stay on the objects as the camera moves.
let objects = [], objectsInfo = null;
const textures = new Map();  // object id -> { source, image }
async function pollObjects() {
  try {
    const result = await (await fetch(`objects.json?t=${Date.now()}`, { cache: "no-store" })).json();
    if (objectsInfo?.updated === result.updated) return;
    objectsInfo = result;
    objects = result.objects;
    for (const o of objects) {
      if (textures.get(o.id)?.source === o.texture) continue;
      const image = new Image();
      image.src = `data:image/png;base64,${o.texture}`;
      textures.set(o.id, { source: o.texture, image });
    }
    addLog(`objects: ${objects.length} found in ${result.seconds} s from ${result.frames} frames (${objects.map((o) => o.label).join(", ")})`, "#fa0");
  } catch { /* no scan has run yet */ }
}
setInterval(pollObjects, 1500);

// Camera image: request the next frame only after the previous one arrived, so a slow link is never flooded.
let requestedAt = 0;
function nextFrame() {
  requestedAt = Date.now();
  frame.src = `${base}/annotated.jpg?w=${viewWidth.value}&t=${requestedAt}`;
}
let imageFailures = 0;
const scheduleFrame = () => setTimeout(nextFrame, Math.max(0, 1000 / Number(viewRate.value) - (Date.now() - requestedAt)));
frame.onload = () => { imageFailures = 0; scheduleFrame(); };
frame.onerror = () => {
  if (++imageFailures === 3) addLog(`camera image is not loading from ${base}/annotated.jpg`, "#f66");
  setTimeout(nextFrame, 1000);
};

function addLog(text, colour) {
  const atBottom = log.scrollTop + log.clientHeight >= log.scrollHeight - 4;
  const line = document.createElement("div");
  line.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
  if (colour) line.style.color = colour;
  log.append(line);
  while (log.childElementCount > 300) log.firstChild.remove();
  if (atBottom) log.scrollTop = log.scrollHeight;
}

// Recording: frames are saved on the Pi by the tracker. This only starts and stops it and shows the count.
// pi/record.sh does the same from a terminal, and can download a recording.
const recordButton = document.getElementById("record"), recordStatus = document.getElementById("recordStatus");
let recording = false;
function showRecording(status) {
  recording = status.recording;
  recordButton.classList.toggle("on", recording);
  recordButton.textContent = recording ? "■ Stop and save" : "● Record";
  const name = status.dir ? status.dir.split("/").pop() : "";
  recordStatus.textContent = recording ? `${name}: ${status.frames} frames saved${status.dropped ? `, ${status.dropped} dropped` : ""}`
    : name ? `last: ${name}, ${status.frames} frames${status.dropped ? `, ${status.dropped} dropped` : ""}` : "";
}
async function recordCall(path) {
  try { showRecording(await (await fetch(`${base}/record/${path}`, { cache: "no-store" })).json()); }
  catch (error) { recordStatus.textContent = `recording control failed: ${error.message}`; }
}
recordButton.onclick = () => {
  if (recording) return recordCall("stop");
  recordCall(`start?every=${document.getElementById("every").value}&w=${document.getElementById("recordWidth").value}`);
};
addEventListener("keydown", (event) => { if (event.key === "r" && event.target.tagName !== "SELECT") recordButton.click(); });
setInterval(() => { if (recording) recordCall("status"); }, 1000);
recordCall("status");

// State normally arrives pushed over the event stream. If the stream delivers nothing for 3 seconds, the page
// polls /state.json instead, and says so in the log, so a problem with one path does not blank the page.
let lastStateAt = 0, lastStreamAt = 0, polling = false, lastComplaintAt = 0;
const events = new EventSource(`${base}/events`);
events.onopen = () => addLog(`event stream open to ${base}`, "#6cf");
events.onerror = () => { if (Date.now() - lastComplaintAt > 5000) { lastComplaintAt = Date.now(); addLog("event stream error, the browser will retry", "#f66"); } };
events.addEventListener("log", (event) => addLog(event.data));  // every line the tracker prints
events.onmessage = (event) => {
  lastStreamAt = Date.now();
  if (polling) { polling = false; addLog("event stream is delivering again, polling stopped", "#6cf"); }
  render(JSON.parse(event.data));
};
setInterval(async () => {
  if (Date.now() - lastStreamAt > 3000) {
    try {
      const state = await (await fetch(`${base}/state.json`, { cache: "no-store" })).json();
      if (!polling) { polling = true; addLog("event stream is silent, polling /state.json instead", "#fa0"); }
      if (state.frame) render(state);
    } catch (error) {
      if (Date.now() - lastComplaintAt > 5000) { lastComplaintAt = Date.now(); addLog(`cannot reach the tracker at ${base}: ${error.message}`, "#f66"); }
    }
  }
  if (Date.now() - lastStateAt > 1500) numbers.innerHTML = `<div class="bad"><b>no data</b>is the tracker running?</div>`;
}, 250);
nextFrame();

function render(state) {
  lastStateAt = Date.now();
  const [frameW] = state.frame, [floorW, floorH] = state.floor;
  const cell = (value, label, good) => `<div class="${good === undefined ? "" : good ? "ok" : "bad"}"><b>${value}</b>${label}</div>`;
  const pose = (p) => (p?.x === undefined ? "not seen" : `${p.x.toFixed(1)}, ${p.y.toFixed(1)} cm`);
  numbers.innerHTML =
    cell(state.calibrated ? `${state.cameraHeight} cm` : "unknown", "camera height", state.calibrated) +
    cell(`${state.learned} of 4`, "floor markers learned", state.learned === 4) +
    cell(state.floorMarkers, "used this frame", state.floorMarkers > 0) +
    cell(pose(state.robot), state.robot?.x === undefined ? "robot" : `robot, heading ${state.robot.heading.toFixed(0)}, height ${state.robot.z.toFixed(1)}`, state.robot?.x !== undefined) +
    cell(pose(state.arm), "arm base", state.arm?.x !== undefined) +
    cell(`${state.fps} fps`, `markers in view: ${state.markers.join(" ") || "none"}`) +
    cell(objectsInfo ? objects.length : "off", objectsInfo ? `objects, scanned ${Math.round(Date.now() / 1000 - objectsInfo.updated)} s ago` : "objects: run vision/scan.py --watch", objectsInfo ? Date.now() / 1000 - objectsInfo.updated < 20 : undefined);

  // Camera view: drawn in full-frame pixels, scaled to the displayed image.
  overlay.width = frame.clientWidth; overlay.height = frame.clientHeight;
  const g = overlay.getContext("2d"), k = overlay.width / frameW;
  g.lineWidth = 2; g.font = "14px sans-serif";
  if (state.calibrated) {
    for (const o of objects) {
      const outline = o.outline.map(([x, y]) => floorToPixel(state.camera, x, y));
      const css = `rgb(${o.colour.join(",")})`;
      g.beginPath();
      outline.forEach((p, i) => (i ? g.lineTo(p.u * k, p.v * k) : g.moveTo(p.u * k, p.v * k)));
      g.closePath();
      g.strokeStyle = "#fff"; g.lineWidth = 3; g.stroke();
      g.strokeStyle = css; g.lineWidth = 1.5; g.stroke();
      const top = outline.reduce((a, p) => (p.v < a.v ? p : a));
      g.fillStyle = "#fff"; g.fillText(o.label, top.u * k, top.v * k - 5);
    }
    g.lineWidth = 2;
  }
  for (const [name, colour] of [["robot", "#4cf"], ["arm", "#f6c"]]) {
    const p = state[name];
    if (!p) continue;
    g.strokeStyle = g.fillStyle = colour;
    g.beginPath(); g.arc(p.px[0] * k, p.px[1] * k, 12, 0, 7); g.stroke();
    g.fillText(name, p.px[0] * k + 16, p.px[1] * k);
  }

  // Top-down map in floor centimetres. y is drawn upward. Mirrored layouts (zUp false) are flipped to match the frontend.
  const m = map.getContext("2d"), pad = 30, s = Math.min((map.width - 2 * pad) / floorW, (map.height - 2 * pad) / floorH);
  const at = (x, y) => [pad + x * s, map.height - pad - (state.zUp === false ? floorH - y : y) * s];
  m.clearRect(0, 0, map.width, map.height);
  m.strokeStyle = "#666"; m.strokeRect(pad, map.height - pad - floorH * s, floorW * s, floorH * s);
  m.fillStyle = "#888"; m.font = "12px sans-serif";
  [[0, 0, "1"], [floorW, 0, "2"], [floorW, floorH, "3"], [0, floorH, "4"]].forEach(([x, y, label]) => m.fillText(label, at(x, y)[0] - 3, at(x, y)[1] + 4));
  if (!state.calibrated && !objects.length) return;
  for (const o of objects) {
    // The texture is the object seen from above, upright in its own box: x along the width, the far side on top.
    const [x, y] = at(o.x, o.y), image = textures.get(o.id)?.image;
    m.save();
    m.translate(x, y);
    m.rotate(-o.yaw);  // the map's y axis points up, the canvas's down
    if (image?.complete && image.naturalWidth) m.drawImage(image, (-o.width * s) / 2, (-o.length * s) / 2, o.width * s, o.length * s);
    m.strokeStyle = `rgb(${o.colour.join(",")})`;
    m.strokeRect((-o.width * s) / 2, (-o.length * s) / 2, o.width * s, o.length * s);
    m.restore();
    m.fillStyle = "#ddd";
    m.fillText(o.label, x - 20, y - (Math.max(o.width, o.length) * s) / 2 - 3);
  }
  for (const [name, colour] of [["robot", "#4cf"], ["arm", "#f6c"]]) {
    const p = state[name];
    if (p?.x === undefined) continue;
    const [x, y] = at(p.x, p.y), a = ((state.zUp === false ? -p.heading : p.heading) * Math.PI) / 180;
    m.strokeStyle = m.fillStyle = colour;
    m.beginPath(); m.arc(x, y, 8, 0, 7); m.moveTo(x, y); m.lineTo(x + 20 * Math.cos(a), y - 20 * Math.sin(a)); m.stroke();
    m.fillText(name, x + 12, y - 12);
  }
}
</script>
